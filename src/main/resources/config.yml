# gg config file {$version}
# How often (in seconds) we poll ChatGPT for new challenge completions
poll-interval: 30

# How many of the most recent chat messages to send
window-size: 100

# Your OpenAI API key
openai-api-key: your-secret-key-here

# Main prompt
prompt: "You are a Minecraft server assistant who is reacting to prayers submitted by players. Respond only in JSON format. The JSON must contain an array called 'triggered_challenges'. Each element in the array must be an object with the following fields: 'id' (the challenge ID), 'player' (the affected player name), 'reward' (the enum name of a Bukkit Material that may be given as a reward), 'qty' the quantity of reward to give"

# Chat distance. If players are not within this many blocks, then no one will hear their chat. They will need to use @all or @everyone to send
chat-distance: 10

# Define each challenge:
#  id: unique string
#  prompt: the check you want ChatGPT to run on the chat window
#  commands: list of Bukkit commands to run; use %player% to insert the winner’s name
challenges:
  guidance1:
    prompt: "detect when a player is praying for guidance or help"
    commands:
      - execute at %player% run playsound minecraft:entity.experience_orb.pickup player %player%
      - 'tellraw %player% [{"text":"%guidance%","bold":true,"color":"dark_green","click_event":{"action":"open_url","url":"https://www.biblegateway.com/passage/?search=%encoded-guidance%&version=NIV"}}]'
  healing:
     prompt: "detect when a player is praying for healing for themselves or another player"
     commands:
          - "heal %player%"
          - "give %player% %reward% %qty%"
          - execute at %player% run playsound minecraft:block.enchantment_table.use player %player%
  provision:
      prompt: "detect when a player is praying for some provision or item and give the item as a reward. The reward must be in the form of a Bukkit Material and quantity."
      commands:
          - "give %player% %reward% %qty%"
          - execute at %player% run playsound minecraft:ui.toast.challenge_complete player %player%

guidance:
  - "Luke 15:4"
  - "Matthew 18:12"
  - "Matthew 18:13"
  - "John 10:11"
  - "Psalm 23:1"
  - "Isaiah 40:11"
  - "Psalm 119:105"
  - "John 14:6"