# gg config file {$version}
# How often (in seconds) we poll ChatGPT for new challenge completions
poll-interval: 30

# How many of the most recent chat messages to send
window-size: 100

# Your OpenAI API key
openai-api-key: your-secret-key-here

# Main prompt
prompt: "You are a Minecraft server assistant. Respond only in JSON format. The JSON must contain an array called 'triggered_challenges'. Each element in the array must be an object with the following fields: 'id' (the challenge ID) and 'player' (the player name)."

# Chat distance. If players are not within this many blocks, then no one will hear their chat. They will need to use @all or @everyone to send
chat-distance: 10

# Define each challenge:
#  id: unique string
#  prompt: the check you want ChatGPT to run on the chat window
#  commands: list of Bukkit commands to run; use %player% to insert the winner’s name
challenges:
  greet:
    prompt: "detect when a player sends a greeting in any language"
    commands:
      - "give %player% diamond 1"
      - "msg %player% Thanks for saying hi!"
  goodbye:
    prompt: "detect when a player says goodbye in any language"
    commands:
      - "give %player% emerald 1"
      - "msg %player% Thanks for saying goodbye!"
  help:
    prompt: "detect when a player asks for help in any language"
    commands:
      - "give %player% diamond 1"
      - "msg %player% Thanks for asking for help!"
  welcome:
    prompt: "detect when a player welcomes another player in any language"
    commands:
      - "give %player% diamond 1"
      - "msg %player% Thanks for welcoming others!"
  congrats:
    prompt: "detect when a player congratulates another player in any language"
    commands:
      - "give %player% diamond 1"
      - "msg %player% Thanks for congratulating others!"
  goodluck: 
    prompt: "detect when a player wishes another player good luck in any language"
    commands:
      - "give %player% emerald 1"
      - "msg %player% Thanks for wishing others good luck!"
  goodgame:
    prompt: "detect when a player says 'gg' or 'good game' in any language"
    commands:
      - "give %player% oak_sign 1"
      - "msg %player% Thanks for saying good game!"
  goodjob:  
    prompt: "detect when a player says 'good job' in any language"
    commands:
      - "give %player% diampaperond 1"
      - "msg %player% Thanks for saying good job!"
  thanks:
    prompt: "detect when a player says 'thanks' in any language"
    commands:
      - "eco give %player% 50"
  warpinvite:
    prompt: "detect when a player invites others to warp to their island"
    commands:
      - "msg %player% Congrats on inviting others to your island!"
  question:
    prompt: "detect that a player has asked a question to get help from the community"
    commands:
      - "msg %player% Good job asking the community. If you get an answer, don't forget to say thanks!"
# …add as many as you like
